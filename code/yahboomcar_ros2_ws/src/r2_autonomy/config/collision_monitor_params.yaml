collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_nav"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.5
    source_timeout: 5.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    
    # Polygons: approach at 0.40m front/right-front (slow down, not stop)
    polygons: ["ApproachZone", "StopZone"]
    
    # Approach zone: 0.40m front and right-front - SLOW DOWN
    ApproachZone:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: True
      enabled: True
      # Polygon points (front-biased, 0.40m from base_footprint origin)
      # Robot base_link is ~0.12m from front, so 0.40m obstacle = ~0.28m from base_link
      points: "[[0.40, 0.25], [0.40, -0.15], [0.20, -0.20], [-0.10, -0.20], [-0.10, 0.20], [0.20, 0.20]]"
      
    # Stop zone: very close obstacles - EMERGENCY STOP
    StopZone:
      type: "polygon"
      action_type: "stop"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 0.5
      simulation_time_step: 0.1
      min_points: 6
      visualize: True
      enabled: True
      # Tighter polygon for emergency stop
      points: "[[0.20, 0.15], [0.20, -0.15], [-0.10, -0.15], [-0.10, 0.15]]"
      
    observation_sources: ["scan"]
    
    scan:
      type: "scan"
      topic: "/scan"
      min_height: 0.05
      max_height: 0.50
      enabled: True
